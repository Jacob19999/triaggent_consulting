    // document mints the blobs for its OWN frames, obtaining page text

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {

        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

2;border-radius:14px;padding:26px 26px 28px;background:#fff\">\n<h3 style=\"margin:0 0 9px;font-size:19px;font-weight:700;letter-spacing:-.015em\">Six months, no demo<\u002fh3>\n<p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#5b6178\">Long builds where nothing is visible until the end — which is also the first moment anyone finds out it's wrong.<\u002fp>\n<\u002fdiv>\n<div data-rv=\"\" class=\"tg-card\" style=\"border:1px solid #e9ebf2;border-radius:14px;padding:26px 26px 28px;background:#fff\">\n<h3 style=\"margin:0 0 9px;font-size:19px;font-weight:700;letter-spacing:-.015em\">Software you can't leave<\u002fh3>\n<p style=\"margin:0;font-size:15.5px;line-height:1.6;color:#5b6178\">Built on someone else's accounts and undocumented, so you're renting your own system back from them forever.<\u002fp>\n<\u002fdiv>\n<\u002fdiv>\n<\u002fdiv>\n\n<div id=\"services\" style=\"padding:80px 56px;border-bottom:1px solid #ebedf2;background:#fafbfd\">\n<div data-rv=\"\" style=\"text-align:center;margin-bottom:44px\">\n<div style=\"font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:{{ c.accent }};margin-bottom:14px\">What we build<\u002fdiv>\n<h2 style=\"margin:0 auto 14px;max-width:760px;font-size:42px;line-height:1.12;letter-spacing:-.03em;font-weight:800\">Four things we do most — and one we do on request<\u002fh2>\n<p style=\"margin:0 auto;max-width:620px;font-size:17.5px;line-height:1.6;color:#4a5068\">We pick the approach after we understand the problem, not before. Sometimes the honest answer is the simplest one.<\u002fp>\n<\u002fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:18px\">\n<div data-rv=\"\" class=\"tg-card\" style=\"background:#fff;border:1px solid #e9ebf2;border-radius:16px;padding:30px 32px 32px\">\n<div style=\"width:36px;height:36px;border-radius:10px;background:{{ c.tint }};color:{{ c.accent }};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:16px\">01<\u002fdiv>\n<h3 style=\"margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.02em\">AI agents<\u002fh3>\n<p style=\"margin:0 0 14px;font-size:16px;line-height:1.65;color:#5b6178\">Software that carries out real work end to end — triaging requests, updating records, drafting responses, chasing what people forget. Approvals wherever a mistake would be expensive.<\u002fp>\n<div style=\"font-size:14px;color:{{ c.accent }};font-weight:600\">Turns inbound email into quotes, tickets, or bookings<\u002fdiv>\n<\u002fdiv>\n<div data-rv=\"\" class=\"tg-card\" style=\"background:#fff;border:1px solid #e9ebf2;border-radius:16px;padding:30px 32px 32px\">\n<div style=\"width:36px;height:36px;border-radius:10px;background:{{ c.tint }};color:{{ c.accent }};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:16px\">02<\u002fdiv>\n<h3 style=\"margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Chatbots that know your business<\u002fh3>\n<p style=\"margin:0 0 14px;font-size:16px;line-height:1.65;color:#5b6178\">Connected to your documents, catalogue and bookings, so answers come from your material. It hands over to a human cleanly instead of guessing.<\u002fp>\n<div style=\"font-size:14px;color:{{ c.accent }};font-weight:600\">Handles the questions you answer twenty times a week<\u002fdiv>\n<\u002fdiv>\n<div data-rv=\"\" class=\"tg-card\" style=\"background:#fff;border:1px solid #e9ebf2;border-radius:16px;padding:30px 32px 32px\">\n<div style=\"width:36px;height:36px;border-radius:10px;background:{{ c.tint }};color:{{ c.accent }};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;margin-bottom:16px\">03<\u002fdiv>\n<h3 style=\"margin:0 0 10px;font-size:22px;font-weight:700;letter-spacing:-.02em\">Machine learning<\u002fh3>\n<p style=\"margin:0 0 14px;font-size:16px;line-height:1.65;color:#5b6178\">Forecasting, scoring, classification and recommendations on data \"Quoting is usually slow because the information lives in three places. We wire those together so a first response goes out in minutes.\",\n      bullets: [\"Pulls pricing rules and past jobs automatically\", \"Produces a draft quote for you to check and send\", \"Logs everything back into your CRM\"],\n      quote: \"\\u201cBy the time we quote, half of them have gone elsewhere.\\u201d\",\n      answer: \"A form-to-quote pipeline: enquiry comes in, the system gathers the details, applies your pricing rules, and hands you a draft quote to approve.\",\n      meta: \"Typically 4\\u20136 weeks\" },\n    { label: \"Data & reporting\",\n      title: \"Stop rebuilding the same report every month\",\n      body: \"If someone spends a day a month copying numbers between spreadsheets, that's a system waiting to be written \\u2014 and often the first step toward a real model.\",\n      bullets: [\"Pulls from the tools you already pay for\", \"One dashboard instead of five exports\", \"Forecasting or scoring on top, once the data is clean\"],\n      quote: \"\\u201cOur monthly reporting takes two full days of copy-paste.\\u201d\",\n      answer: \"A pipeline that collects the source data on a schedule, one dashboard people actually open, and \\u2014 if the data supports it \\u2014 a forecast on top.\",\n      meta: \"Typically 3\\u20136 weeks\" },\n    { label: \"Internal tools\",\n      title: \"Replace the spreadsheet everyone is scared of\",\n      body: \"The shared workbook that runs a critical process, has no backup and only one person understands. We turn it into software with permissions and a history.\",\n      bullets: [\"Same workflow, without the accidental overwrites\", \"Roles, so the right people see the right things\", \"An audit trail of who changed what\"],\n      quote: \"\\u201cIf that file gets corrupted, we're finished.\\u201d\",\n      answer: \"A small web app that mirrors how your team already works, with proper accounts, validation and backups \\u2014 then automation layered on where it saves time.\",\n      meta: \"Typically 4\\u20136 weeks\" },\n    { label: \"Websites\",\n      title: \"A site that explains what you do and loads fast\",\n      body: \"Clear, quick marketing sites and booking flows \\u2014 frequently the thing an AI project needed first: somewhere for it to live and something to plug into.\",\n      bullets: [\"Written to be understood, not to impress\", \"Fast on a phone on a bad connection\", \"Editable by you afterwards\"],\n      quote: \"\\u201cOur site is five years old and nobody can update it.\\u201d\",\n      answer: \"A rebuild on something you can edit yourself, wired to your booking or enquiry flow, with the chatbot or agent work slotting in later without a redesign.\",\n      meta: \"Typically 2\\u20134 weeks\" }\n  ];\n  palettes = {\n    Indigo:  { accent:\"#4f46e5\", g2:\"#7c6cf7\", g3:\"#8b5cf6\", step2:\"#6a60ea\", step3:\"#857aef\", step4:\"#a094f4\", tint:\"#f1efff\", tint2:\"#e8e5ff\", tintBorder:\"#ddd8ff\", glow:\"#eeecff\", rgb:\"79,70,229\" },\n    Teal:    { accent:\"#0d9488\", g2:\"#22c1a8\", g3:\"#14b8a6\", step2:\"#14a89b\", step3:\"#3cc0b3\", step4:\"#7ad4cb\", tint:\"#eafaf7\", tint2:\"#d5f4ee\", tintBorder:\"#b7e9e1\", glow:\"#e6f8f5\", rgb:\"13,148,136\" },\n    Ember:   { accent:\"#d1502a\", g2:\"#ee7f47\", g3:\"#e8703a\", step2:\"#de6438\", step3:\"#e8804f\", step4:\"#f0a175\", tint:\"#fdf0e9\", tint2:\"#fbe1d4\", tintBorder:\"#f6cdb8\", glow:\"#fdf1ea\", rgb:\"209,80,42\" },\n    Cobalt:  { accent:\"#1d4ed8\", g2:\"#4f8bf5\", g3:\"#3b82f6\", step2:\"#2a63e0\", step3:\"#4d80e8\", step4:\"#7ea5f0\", tint:\"#eaf1ff\", tint2:\"#d9e6ff\", tintBorder:\"#bcd3fb\", glow:\"#e8f0ff\", rgb:\"29,78,216\" },\n    Forest:  { accent:\"#15803d\", g2:\"#3cb464\", g3:\"#22a04f\", step2:\"#1c9349\", step3:\"#3fae67\", step4:\"#79c894\", tint:\"#ecf8f0\", tint2:\"#d9f0e1\", tintBorder:\"#bde3c9\", glow:\"#eaf7ef\", rgb:\"21,128,61\" },\n    Plum:    { accent:\"#9333ea\", g2:\"#c084fc\", g3:\"#a855f7\", step2:\"#a247ee\", step3:\"#b76ff3\", step4:\"#cf9df8\", tint:\"#f8effe\", tint2:\"#f0dffd\", tintBorder:\"#e6cbfb\", glow:\"#f6ecfe\", rgb:\"147,51,234\" }\n  };\n  theme() {\n    const p = this.palettes[this.props.palette] || this.palettes.Indigo;\n    return { ...p,\n      grad: `linear-gradient(135deg,${p.accent},${p.g2})`,\n      gradText: `linear-gradient(100deg,${p.accent},${p.g3})`,\n      sh35: `rgba(${p.rgb},.35)`, sh32: `rgba(${p.rgb},.32)`,\n      sh30: `rgba(${p.rgb},.3)`, sh28: `rgba(${p.rgb},.28)` };\n  }\n  _reveal(el) {\n    if (el.classList.contains('in')) return;\n    el.classList.add('in');\n    if (this._io) this._io.unobserve(el);\n  }\n  _scan() {\n    if (!this._io) return;\n    const groups = new Map();\n    document.querySelectorAll('[data-rv]').forEach(el => {\n      const arr = groups.get(el.parentElement) || [];\n      arr.push(el); groups.set(el.parentElement, arr);\n    });\n    groups.forEach(arr => arr.forEach((el, n) => {\n      if (el.classList.contains('in')) return;\n      el.style.animationDelay = Math.min(n, 5) * 85 + 'ms';\n      // already on screen (re-created node, or above the fold) -> reveal now\n      const r = el.getBoundingClientRect();\n      if (this._armed && r.top < window.innerHeight && r.bottom > 0) this._reveal(el);\n      else this._io.observe(el);\n    }));\n  }\n  componentDidMount() {\n    document.documentElement.classList.add('tg-rv');\n    this._io = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) this._reveal(e.target); });\n    }, { threshold: 0.08, rootMargin: '0px 0px -5% 0px' });\n    this._scan();\n    // after first paint, any node already in view reveals immediately on re-render\n    requestAnimationFrame(() => { this._armed = true; });\n    // failsafe: nothing may ever be stranded invisible\n    this._t = setInterval(() => {\n      document.querySelectorAll('[data-rv]:not(.in)').forEach(el => {\n        if (el.getBoundingClientRect().top < window.innerHeight) this._reveal(el);\n      });\n    }, 900);\n    this._onScroll = () => this._scan();\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onKey = (e) => {\n      if (e.key === 'Escape' && this.state.contactOpen) this.closeContact();\n    };\n    window.addEventListener('keydown', this._onKey);\n  }\n  componentDidUpdate() { this._scan(); }\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    clearInterval(this._t);\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('keydown', this._onKey);\n  }\n  openContact = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    document.body.style.overflow = 'hidden';\n    this.setState({ contactOpen: true, sent: false, sending: false, error: \"\" });\n  };\n  closeContact = () => {\n    document.body.style.overflow = '';\n    this.setState({ contactOpen: false });\n  };\n  renderVals() {\n    const i = this.state.tab;\n    const c = this.theme();\n    const email = this.props.email ?? \"contact@triaggent.com\";\n    return {\n      c,\n      panelAnim: 'animation:' + (this.state.anim ? 'tgFadeA' : 'tgFadeB') + ' .34s cubic-bezier(.22,.8,.28,1) both',\n      email,\n      showDemo: this.props.showDemo ?? true,\n      active: this.cases[i],\n      tabs: this.cases.map((cs, n) => ({\n        label: cs.label,\n        select: () => this.setState(s => (s.tab === n ? null : { tab: n, anim: s.anim ^ 1 })),\n        bg: n === i ? c.accent : \"#fff\",\n        fg: n === i ? \"#fff\" : \"#4a5068\",\n        bd: n === i ? c.accent : \"#e2e5ee\",\n        sh: n === i ? \"0 2px 8px \" + c.sh28 : \"none\"\n      })),\n      contactOpen: this.state.contactOpen,\n      sent: this.state.sent,\n      sending: this.state.sending,\n      error: this.state.error,\n      errorDisplay: this.state.error ? \"block\" : \"none\",\n      submitLabel: this.state.sending ? \"Sending…\" : \"Send message →\",\n      submitOpacity: this.state.sending ? \".7\" : \"1\",\n      submitCursor: this.state.sending ? \"wait\" : \"pointer\",\n      name: this.state.name,\n      userEmail: this.state.userEmail,\n      subject: this.state.subject,\n      message: this.state.message,\n      honey: this.state.honey,\n      openContact: this.openContact,\n      closeContact: this.closeContact,\n      stop: (e) => e.stopPropagation(),\n      setName: (e) => this.setState({ name: e.target.value, error: \"\" }),\n      setUserEmail: (e) => this.setState({ userEmail: e.target.value, error: \"\" }),\n      setSubject: (e) => this.setState({ subject: e.target.value, error: \"\" }),\n      setMessage: (e) => this.setState({ message: e.target.value, error: \"\" }),\n      setHoney: (e) => this.setState({ honey: e.target.value }),\n      submitContact: async (e) => {\n        e.preventDefault();\n        if (this.state.sending) return;\n        const name = (this.state.name || \"\").trim();\n        const userEmail = (this.state.userEmail || \"\").trim();\n        const subject = (this.state.subject || \"\").trim() || \"New enquiry via triaggent.com\";\n        const message = (this.state.message || \"\").trim();\n        const honey = (this.state.honey || \"\").trim();\n        if (!name || !userEmail || !message) {\n          this.setState({ error: \"Please fill in your name, email, and message.\" });\n          return;\n        }\n        if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(userEmail)) {\n          this.setState({ error: \"Please enter a valid email address.\" });\n          return;\n        }\n        this.setState({ sending: true, error: \"\" });\n        try {\n          const res = await fetch(\"contact.php\", {\n            method: \"POST\",\n            headers: { \"Content-Type\": \"application/json\", \"Accept\": \"application/json\" },\n            body: JSON.stringify({\n              name,\n              email: userEmail,\n              subject,\n              message,\n              website: honey\n            })\n          });\n          let data = {};\n          try { data = await res.json(); } catch (_) {}\n          if (!res.ok || !data.ok) {\n            throw new Error((data && data.error) || (\"Could not send. Please email \" + email + \" directly.\"));\n          }\n          this.setState({\n            sent: true,\n            sending: false,\n            error: \"\",\n            name: \"\",\n            userEmail: \"\",\n            subject: \"\",\n            message: \"\",\n            honey: \"\"\n          });\n        } catch (err) {\n          this.setState({\n            sending: false,\n            error: (err && err.message) || (\"Could not send. Please email \" + email + \" directly.\")\n          });\n        }\n      }\n    };\n  }\n}\n<\u002fscript>\n\n\n<\u002fbody><\u002fhtml>"</script>
